<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Les Chroniques des Brumes Argentées</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
       <video
    id="livreVivant"
    class="video-fond"
    autoplay
    muted
    loop
    playsinline
    preload="auto"
    disablepictureinpicture>

    <source
        src="videos/livreVivant.mp4"
        type="video/mp4">

</video>

<div class="intro-container">

    <div class="ligne ligne1">
        Une mystérieuse aventure
    </div>

    <div class="ligne ligne2">
        t'attend derrière les
    </div>

    <div class="ligne ligne3">
        Brumes Argentées
    </div>

    <div class="ligne ligne4">
        Choisis le héros
    </div>

    <div class="ligne ligne5">
        que tu souhaites incarner...
    </div>

</div>


        <div class="choix-personnage">

    <button id="btnGarcon">
        Porteur des Brumes
    </button>

    <button id="btnFille">
        Porteuse des Brumes
    </button>

</div>

<form id="formInscription" style="display:none;">

    <h2 id="titreChoix"></h2>

    <input
        type="text"
        id="prenom"
        placeholder="Ton prénom"
        required
    >

    <button type="submit">
        Commencer l'aventure
    </button>

</form>
   
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="JS/supabase.js"></script>
<script src="JS/accueil.js"></script>
<script src="JS/inscription.js"></script>

</body>
</html>
